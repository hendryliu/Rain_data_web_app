<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Singapore Rainfall</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; overflow: hidden; }

  /* Left column: map + chart */
  #left-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #station-search {
    position: relative;
    padding: 6px 10px; background: white;
    border-bottom: 1px solid #e0e0e0;
  }
  #station-search-input {
    width: 100%; padding: 6px 10px; border: 1px solid #ccc;
    border-radius: 6px; font-size: 0.9em;
  }
  #station-search-input:focus { outline: none; border-color: #1976d2; }
  #station-search-results {
    position: absolute; left: 10px; right: 10px; top: 100%;
    background: white; border: 1px solid #ddd; border-top: none;
    list-style: none; max-height: 240px; overflow-y: auto;
    z-index: 1500; display: none;
  }
  #station-search-results.active { display: block; }
  #station-search-results li {
    padding: 6px 10px; cursor: pointer;
  }
  #station-search-results li:hover, #station-search-results li.kbd-active { background: #e3f2fd; }
  #map { flex: 1; min-height: 0; }
  #chart-container {
    flex: 1; padding: 10px;
    display: flex; flex-direction: column;
  }
  #controls {
    display: flex; align-items: center; gap: 12px;
    padding: 6px 0; flex-shrink: 0;
  }
  #station-label { font-weight: 600; font-size: 1.1em; }
  #year-select { padding: 4px 8px; font-size: 0.95em; }
  #loading { display: none; color: #666; font-style: italic; }
  #chart { flex: 1; min-height: 0; }
  #placeholder {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: #999; font-size: 1.2em;
  }

  /* Right column: chat panel */
  #chat-panel {
    position: relative;
    width: 360px; border-left: 1px solid #ddd;
    display: flex; flex-direction: column; background: #fafafa;
    transition: width 0.2s;
  }
  #chat-panel.resizing { transition: none; }
  #chat-panel.collapsed { width: 0; overflow: hidden; border: none; }
  #chat-resize-handle {
    position: absolute; left: -3px; top: 0; bottom: 0;
    width: 6px; cursor: col-resize; z-index: 1100;
  }
  #chat-resize-handle:hover, body.resizing-chat #chat-resize-handle {
    background: rgba(25, 118, 210, 0.25);
  }
  body.resizing-chat { cursor: col-resize; user-select: none; }

  #chat-toggle {
    position: fixed; right: 8px; top: 8px; z-index: 1000;
    background: #1976d2; color: white; border: none;
    border-radius: 6px; padding: 6px 12px; cursor: pointer;
    font-size: 0.85em;
  }
  #chat-toggle:hover { background: #1565c0; }

  #chat-header {
    padding: 12px 14px; font-weight: 600; font-size: 1.05em;
    border-bottom: 1px solid #e0e0e0; background: white;
  }

  /* Quick query buttons */
  .qq-btn {
    padding: 5px 10px; font-size: 0.8em; border: 1px solid #ccc;
    border-radius: 14px; background: white; cursor: pointer;
    color: #333; transition: all 0.15s;
  }
  .qq-btn:hover:not(:disabled) { background: #e3f2fd; border-color: #1976d2; color: #1976d2; }
  .qq-btn:disabled { opacity: 0.4; cursor: default; }
  .qq-btn.special { border-color: #7b1fa2; color: #7b1fa2; }
  .qq-btn.special:hover:not(:disabled) { background: #f3e5f5; }

  /* Tabs */
  #qq-tabs {
    display: flex; padding: 8px 10px 0; gap: 4px;
    background: white; border-bottom: 1px solid #f0f0f0;
  }
  .qq-tab {
    padding: 6px 12px; font-size: 0.8em;
    border: none; background: transparent; cursor: pointer;
    color: #666; border-bottom: 2px solid transparent;
    border-radius: 4px 4px 0 0;
  }
  .qq-tab:hover { color: #1976d2; }
  .qq-tab.active { color: #1976d2; border-bottom-color: #1976d2; font-weight: 600; }
  #quick-queries { padding: 8px 10px 10px; }
  .qq-tab-panel { display: none; flex-wrap: wrap; gap: 6px; }
  .qq-tab-panel.active { display: flex; }

  /* Messages area */
  #messages {
    flex: 1; overflow-y: auto; padding: 12px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg { max-width: 95%; padding: 8px 12px; border-radius: 12px; font-size: 0.9em; line-height: 1.4; }
  .msg.user { align-self: flex-end; background: #1976d2; color: white; border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: white; border: 1px solid #e0e0e0; border-bottom-left-radius: 4px; }
  .msg .msg-title { font-weight: 600; margin-bottom: 4px; }
  .msg table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 0.85em; }
  .msg th, .msg td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #eee; }
  .msg th { background: #f5f5f5; font-weight: 600; }
  .msg tr:nth-child(even) td { background: #fafafa; }
  .msg .inline-chart { width: 100%; height: 200px; margin-top: 6px; }
  .msg .msg-text { margin-top: 6px; color: #555; font-size: 0.85em; }
  .msg .msg-ran { margin-top: 6px; font-size: 0.75em; color: #999; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .msg .msg-ran code { background: #f5f5f5; padding: 1px 5px; border-radius: 3px; color: #555; }
  .msg.loading-msg { color: #888; font-style: italic; }

  /* Generic parameter picker modal */
  #param-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 2000;
    align-items: center; justify-content: center;
  }
  #param-overlay.active { display: flex; }
  #param-dialog {
    background: white; border-radius: 10px; padding: 20px; width: 340px;
    max-height: 70vh; display: flex; flex-direction: column; gap: 10px;
  }
  #param-dialog h3 { margin-bottom: 4px; }
  .param-row { display: flex; flex-direction: column; gap: 4px; }
  .param-row label { font-size: 0.85em; color: #555; font-weight: 600; }
  .param-row input, .param-row select {
    padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95em;
  }
  .param-row .station-results {
    list-style: none; max-height: 140px; overflow-y: auto;
    border: 1px solid #eee; border-radius: 6px; margin-top: 4px;
    display: none;
  }
  .param-row .station-results.active { display: block; }
  .param-row .station-results li { padding: 6px 10px; cursor: pointer; }
  .param-row .station-results li:hover, .param-row .station-results li.selected { background: #e3f2fd; }
  #param-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
  #param-actions button {
    padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.9em; border: 1px solid #ccc;
    background: white;
  }
  #param-actions #param-submit { background: #1976d2; border-color: #1976d2; color: white; }
  #param-actions #param-submit:disabled { opacity: 0.5; cursor: default; }

  /* Chat input */
  #chat-input-area {
    padding: 10px; border-top: 1px solid #e0e0e0; background: white;
    display: flex; gap: 8px;
  }
  #chat-input {
    flex: 1; padding: 8px 12px; border: 1px solid #ccc; border-radius: 18px;
    font-size: 0.9em; outline: none;
  }
  #chat-input:focus { border-color: #1976d2; }
  #chat-input:disabled { background: #f0f0f0; }
  #chat-send {
    background: #1976d2; color: white; border: none; border-radius: 50%;
    width: 36px; height: 36px; cursor: pointer; font-size: 1.1em;
  }
  #chat-send:hover { background: #1565c0; }
  #chat-send:disabled { opacity: 0.4; cursor: default; }
  #llm-notice { display: none; font-size: 0.75em; color: #999; padding: 0 10px 6px; }

  @media (max-width: 768px) {
    body { flex-direction: column; }
    #chat-panel { width: 100%; height: 45vh; border-left: none; border-top: 1px solid #ddd; }
    #chat-panel.collapsed { height: 0; }
    #chat-resize-handle { display: none; }
    #left-col { height: 55vh; }
  }
</style>
</head>
<body>

<button id="chat-toggle" onclick="toggleChat()">Chat</button>

<div id="left-col">
  <div id="station-search">
    <input id="station-search-input" type="text" placeholder="Search station…" autocomplete="off">
    <ul id="station-search-results"></ul>
  </div>
  <div id="map"></div>
  <div id="chart-container">
    <div id="controls">
      <span id="station-label"></span>
      <select id="year-select" style="display:none">
        <option value="">All years</option>
      </select>
      <span id="loading">Loading...</span>
    </div>
    <div id="placeholder">Click a station on the map to view rainfall data</div>
    <div id="chart"></div>
  </div>
</div>

<div id="chat-panel">
  <div id="chat-resize-handle" title="Drag to resize"></div>
  <div id="chat-header">Rainfall Chat</div>
  <div id="qq-tabs"></div>
  <div id="quick-queries"></div>
  <div id="messages">
    <div class="msg assistant">Select a station on the map, then use the buttons above or type a question.</div>
  </div>
  <div id="llm-notice">LLM not available — only quick queries are enabled.</div>
  <div id="chat-input-area">
    <input id="chat-input" type="text" placeholder="Ask about rainfall data..." disabled>
    <button id="chat-send" disabled onclick="sendFreeform()">&#8593;</button>
  </div>
</div>

<!-- Generic parameter picker -->
<div id="param-overlay">
  <div id="param-dialog">
    <h3 id="param-title">Configure</h3>
    <div id="param-fields"></div>
    <div id="param-actions">
      <button id="param-cancel" type="button">Cancel</button>
      <button id="param-submit" type="button">Run</button>
    </div>
  </div>
</div>

<script>
// --- Map setup ---
const map = L.map('map').setView([1.35, 103.82], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors', maxZoom: 18
}).addTo(map);

let selectedStation = null;
let allStations = [];
let llmAvailable = false;
let rainfallController = null;
let chartIdCounter = 0;
let zoomDebounceTimer = null;
let suppressNextRelayout = false;

// --- Load stations ---
fetch('/api/stations')
  .then(r => r.json())
  .then(stations => {
    allStations = stations;
    stations.forEach(s => {
      const marker = L.circleMarker([s.lat, s.lng], {
        radius: 6, color: '#1976d2', fillColor: '#42a5f5',
        fillOpacity: 0.8, weight: 1.5
      }).addTo(map);
      marker.bindPopup(`<b>${s.name}</b><br>ID: ${s.id}`);
      marker.on('click', () => selectStation(s));
    });
  });

// --- Station search ---
(function setupStationSearch() {
  const input = document.getElementById('station-search-input');
  const list = document.getElementById('station-search-results');
  let kbdIdx = -1;

  function render(matches) {
    list.innerHTML = '';
    matches.forEach((s, i) => {
      const li = document.createElement('li');
      li.textContent = `${s.name} (${s.id})`;
      if (i === kbdIdx) li.classList.add('kbd-active');
      li.onmousedown = (e) => {  // mousedown so it fires before blur clears the list
        e.preventDefault();
        pick(s);
      };
      list.appendChild(li);
    });
    list.classList.toggle('active', matches.length > 0);
  }

  function currentMatches() {
    const q = input.value.toLowerCase().trim();
    if (!q) return [];
    return allStations
      .filter(s => s.name.toLowerCase().includes(q) || s.id.toLowerCase().includes(q))
      .slice(0, 8);
  }

  function pick(s) {
    selectStation(s);
    map.setView([s.lat, s.lng], 15);
    input.value = '';
    list.classList.remove('active');
    kbdIdx = -1;
  }

  input.addEventListener('input', () => {
    kbdIdx = -1;
    render(currentMatches());
  });
  input.addEventListener('focus', () => render(currentMatches()));
  input.addEventListener('blur', () => setTimeout(() => list.classList.remove('active'), 150));
  input.addEventListener('keydown', (e) => {
    const matches = currentMatches();
    if (!matches.length) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      kbdIdx = (kbdIdx + 1) % matches.length;
      render(matches);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      kbdIdx = (kbdIdx - 1 + matches.length) % matches.length;
      render(matches);
    } else if (e.key === 'Enter' && kbdIdx >= 0) {
      e.preventDefault();
      pick(matches[kbdIdx]);
    } else if (e.key === 'Escape') {
      list.classList.remove('active');
    }
  });
})();

// --- Load available years ---
fetch('/api/years')
  .then(r => r.json())
  .then(years => {
    const sel = document.getElementById('year-select');
    years.forEach(y => {
      const opt = document.createElement('option');
      opt.value = String(y);
      opt.textContent = String(y);
      sel.appendChild(opt);
    });
  });

function selectStation(station) {
  selectedStation = station;
  document.getElementById('station-label').textContent = station.name;
  document.getElementById('year-select').style.display = '';
  loadRainfall();
  updateQQButtons();
}

document.getElementById('year-select').addEventListener('change', () => {
  if (!selectedStation) return;
  const y = document.getElementById('year-select').value;
  loadRainfall(y ? { year: parseInt(y, 10) } : {});
});

function loadRainfall(opts = {}) {
  // opts may contain {start: Date, end: Date, year: number}
  const params = new URLSearchParams();
  if (opts.year) {
    params.set('year', opts.year);
  } else {
    if (opts.start) params.set('start', opts.start.toISOString());
    if (opts.end)   params.set('end', opts.end.toISOString());
  }
  const queryString = params.toString();
  const url = `/api/rainfall/${selectedStation.id}` + (queryString ? `?${queryString}` : '');

  document.getElementById('loading').style.display = '';
  document.getElementById('placeholder').style.display = 'none';
  document.getElementById('chart').style.display = '';

  if (rainfallController) rainfallController.abort();
  rainfallController = new AbortController();

  fetch(url, { signal: rainfallController.signal })
    .then(r => {
      if (!r.ok) throw new Error(`rainfall fetch failed: ${r.status}`);
      return r.json();
    })
    .then(data => {
      document.getElementById('loading').style.display = 'none';

      const unitLabel =
        data.resolution === 'raw'    ? 'mm / 5-min' :
        data.resolution === 'hourly' ? 'mm / hour'  :
                                       'mm / day';
      const chartType = data.resolution === 'raw' ? 'scatter' : 'bar';

      const trace = {
        x: data.points.map(p => p.timestamp),
        y: data.points.map(p => p.value),
        type: chartType,
        name: 'Rainfall',
      };
      if (chartType === 'scatter') {
        trace.mode = 'lines';
        trace.line = { color: '#1976d2', width: 1 };
      } else {
        trace.marker = { color: '#42a5f5' };
      }

      // Plotly.react can emit a synthetic plotly_relayout that would otherwise
      // re-trigger handleZoom and cause an infinite loop.
      suppressNextRelayout = true;
      Plotly.react('chart', [trace], {
        title: `Rainfall \u2014 ${selectedStation.name} (${data.resolution})`,
        xaxis: { title: 'Time' },
        yaxis: { title: unitLabel },
        margin: { t: 40, b: 50, l: 60, r: 20 },
        dragmode: 'zoom',
      }, {
        responsive: true,
        // Drag-to-zoom is what drives the tier drill-down; box/lasso select
        // would only confuse users here.
        modeBarButtonsToRemove: ['select2d', 'lasso2d'],
      });

      // Bind zoom handler once. Plotly.react preserves the node but not
      // necessarily prior listeners bound via .on() \u2014 re-binding is safe
      // because we removeAllListeners for this event first.
      const chartEl = document.getElementById('chart');
      if (chartEl.removeAllListeners) chartEl.removeAllListeners('plotly_relayout');
      chartEl.on('plotly_relayout', handleZoom);
    })
    .catch(err => {
      if (err.name === 'AbortError') return;
      document.getElementById('loading').style.display = 'none';
      document.getElementById('placeholder').style.display = '';
      document.getElementById('placeholder').textContent = 'Could not load rainfall data.';
      document.getElementById('chart').style.display = 'none';
    });
}

function handleZoom(ev) {
  // Suppress events triggered by our own Plotly.react re-render.
  if (suppressNextRelayout) {
    suppressNextRelayout = false;
    return;
  }

  // Double-click reset → fetch the full range (overview / daily tier).
  if (ev['xaxis.autorange']) {
    clearTimeout(zoomDebounceTimer);
    zoomDebounceTimer = setTimeout(() => loadRainfall({}), 300);
    return;
  }

  // User-initiated zoom or pan.
  const hasRange = ('xaxis.range[0]' in ev) || Array.isArray(ev['xaxis.range']);
  if (!hasRange) return;

  clearTimeout(zoomDebounceTimer);
  zoomDebounceTimer = setTimeout(() => {
    const range = ev['xaxis.range'];
    const rawStart = ev['xaxis.range[0]'] ?? (Array.isArray(range) ? range[0] : null);
    const rawEnd   = ev['xaxis.range[1]'] ?? (Array.isArray(range) ? range[1] : null);
    if (rawStart == null || rawEnd == null) return;
    loadRainfall({ start: new Date(rawStart), end: new Date(rawEnd) });
  }, 300);
}

// --- Chat panel toggle ---
function toggleChat() {
  const panel = document.getElementById('chat-panel');
  panel.classList.toggle('collapsed');
  document.getElementById('chat-toggle').textContent = panel.classList.contains('collapsed') ? 'Chat' : 'Close';
  setTimeout(() => map.invalidateSize(), 250);
}

// --- Chat panel resize ---
(function setupChatResize() {
  const panel = document.getElementById('chat-panel');
  const handle = document.getElementById('chat-resize-handle');
  const MIN_WIDTH = 280;
  const MAX_WIDTH = 800;

  // Restore saved width on load (skip on mobile layout where width is 100%).
  const saved = parseInt(localStorage.getItem('chat.panelWidth') || '', 10);
  if (saved && window.matchMedia('(min-width: 769px)').matches) {
    panel.style.width = Math.max(MIN_WIDTH, Math.min(MAX_WIDTH, saved)) + 'px';
  }

  let startX = 0;
  let startWidth = 0;

  function onMove(e) {
    const dx = startX - e.clientX;  // dragging left → wider
    const newWidth = Math.max(MIN_WIDTH, Math.min(MAX_WIDTH, startWidth + dx));
    panel.style.width = newWidth + 'px';
    if (typeof map !== 'undefined') map.invalidateSize();
  }

  function onUp() {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    panel.classList.remove('resizing');
    document.body.classList.remove('resizing-chat');
    localStorage.setItem('chat.panelWidth', String(parseInt(panel.style.width, 10)));
  }

  handle.addEventListener('mousedown', (e) => {
    e.preventDefault();
    startX = e.clientX;
    startWidth = panel.getBoundingClientRect().width;
    panel.classList.add('resizing');
    document.body.classList.add('resizing-chat');
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
})();

// --- Quick query buttons ---
const QQ_TABS = [
  { id: 'station', label: 'Station' },
  { id: 'trends',  label: 'Trends' },
  { id: 'multi',   label: 'Multi-station' },
  { id: 'season',  label: 'Seasonal' },
];

const QUICK_QUERIES = [
  // Station tab
  { id: 'station_summary', label: 'Station Stats',  tab: 'station', needsStation: true },
  { id: 'monthly_totals',  label: 'Monthly Totals', tab: 'station', needsStation: true },
  { id: 'yearly_totals',   label: 'Yearly Totals',  tab: 'station', needsStation: true },
  { id: 'top_rainy_days',  label: 'Top Rainy Days', tab: 'station', needsStation: true },
  { id: 'longest_dry_spell', label: 'Dry Spell',    tab: 'station', needsStation: true },
  { id: 'hourly_pattern',  label: 'Hourly Pattern', tab: 'station', needsStation: true },
  { id: 'rainiest_week',   label: 'Rainiest Week',  tab: 'station', needsStation: true },

  // Trends tab
  { id: 'compare_stations', label: 'Compare Stations', tab: 'trends', needsStation: true, special: true },
  { id: 'yearly_trend',     label: 'Yearly Trend',     tab: 'trends', needsStation: true },
  { id: 'year_comparison',  label: 'Year Comparison',  tab: 'trends', needsStation: true, special: true },

  // Multi-station tab
  { id: 'station_ranking', label: 'Station Ranking', tab: 'multi', special: true },
  { id: 'regional_total',  label: 'Regional Total',  tab: 'multi' },

  // Seasonal tab
  { id: 'monsoon_breakdown', label: 'Monsoon Breakdown', tab: 'season', needsStation: true },
  { id: 'season_comparison', label: 'Season Comparison', tab: 'season', needsStation: true },
];

function buildQQButtons() {
  // Build tab strip.
  const tabsContainer = document.getElementById('qq-tabs');
  QQ_TABS.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'qq-tab';
    btn.dataset.tabId = t.id;
    btn.textContent = t.label;
    btn.onclick = () => activateTab(t.id);
    tabsContainer.appendChild(btn);
  });

  // Build per-tab chip panels.
  const container = document.getElementById('quick-queries');
  QQ_TABS.forEach(t => {
    const panel = document.createElement('div');
    panel.className = 'qq-tab-panel';
    panel.dataset.tabId = t.id;
    QUICK_QUERIES.filter(q => q.tab === t.id).forEach(q => {
      const btn = document.createElement('button');
      btn.className = 'qq-btn' + (q.special ? ' special' : '');
      btn.textContent = q.label;
      btn.disabled = true;
      btn.dataset.queryId = q.id;
      btn.onclick = () => handleQQ(q);
      panel.appendChild(btn);
    });
    container.appendChild(panel);
  });

  const initial = sessionStorage.getItem('qq.activeTab') || 'station';
  activateTab(initial);
}

function activateTab(tabId) {
  document.querySelectorAll('.qq-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tabId === tabId);
  });
  document.querySelectorAll('.qq-tab-panel').forEach(p => {
    p.classList.toggle('active', p.dataset.tabId === tabId);
  });
  sessionStorage.setItem('qq.activeTab', tabId);
}

function updateQQButtons() {
  document.querySelectorAll('.qq-btn').forEach(btn => {
    const q = QUICK_QUERIES.find(qq => qq.id === btn.dataset.queryId);
    btn.disabled = (q.needsStation && !selectedStation);
  });
}

// --- Schema-driven parameter modal ---
let paramSchemaCache = null;

async function loadParamSchema() {
  if (paramSchemaCache) return paramSchemaCache;
  const r = await fetch('/api/chat/queries');
  const arr = await r.json();
  paramSchemaCache = Object.fromEntries(arr.map(q => [q.id, q]));
  return paramSchemaCache;
}

async function openParamPicker(queryId, prefilled = {}) {
  const schema = (await loadParamSchema())[queryId];
  if (!schema) return null;

  const overlay = document.getElementById('param-overlay');
  const fieldsEl = document.getElementById('param-fields');
  const titleEl = document.getElementById('param-title');
  const submitBtn = document.getElementById('param-submit');
  const cancelBtn = document.getElementById('param-cancel');

  titleEl.textContent = schema.description || 'Configure parameters';
  fieldsEl.innerHTML = '';

  const values = { ...prefilled };

  // Render one row per missing required param (and optional params with no prefilled value).
  Object.entries(schema.params).forEach(([name, spec]) => {
    if (name in values && values[name] != null && values[name] !== '') return;

    const row = document.createElement('div');
    row.className = 'param-row';
    const lbl = document.createElement('label');
    lbl.textContent = name + (spec.required ? '' : ' (optional)');
    row.appendChild(lbl);

    if (name.startsWith('station_id')) {
      // Station search input + filtered list.
      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = 'Search station\u2026';
      const list = document.createElement('ul');
      list.className = 'station-results';
      const refresh = () => {
        const q = input.value.toLowerCase();
        list.innerHTML = '';
        const exclude = new Set(
          Object.entries(values)
            .filter(([k, v]) => k.startsWith('station_id') && v && k !== name)
            .map(([, v]) => v)
        );
        allStations
          .filter(s => !exclude.has(s.id))
          .filter(s => s.name.toLowerCase().includes(q) || s.id.toLowerCase().includes(q))
          .slice(0, 8)
          .forEach(s => {
            const li = document.createElement('li');
            li.textContent = `${s.name} (${s.id})`;
            li.onclick = () => {
              values[name] = s.id;
              input.value = s.name;
              list.classList.remove('active');
              updateSubmit();
            };
            list.appendChild(li);
          });
        list.classList.toggle('active', list.children.length > 0 && document.activeElement === input);
      };
      input.addEventListener('input', refresh);
      input.addEventListener('focus', refresh);
      input.addEventListener('blur', () => setTimeout(() => list.classList.remove('active'), 150));
      row.appendChild(input);
      row.appendChild(list);
    } else if (name.startsWith('year')) {
      const sel = document.createElement('select');
      const blank = document.createElement('option');
      blank.value = ''; blank.textContent = spec.required ? 'Pick a year\u2026' : '(any)';
      sel.appendChild(blank);
      // Populate from the same list as the main year select.
      const mainSel = document.getElementById('year-select');
      Array.from(mainSel.options).forEach(o => {
        if (!o.value) return;
        const opt = document.createElement('option');
        opt.value = o.value; opt.textContent = o.textContent;
        sel.appendChild(opt);
      });
      sel.addEventListener('change', () => {
        values[name] = sel.value ? parseInt(sel.value, 10) : null;
        updateSubmit();
      });
      row.appendChild(sel);
    } else if (spec.type === 'int') {
      const input = document.createElement('input');
      input.type = 'number'; input.min = '1'; input.max = '100';
      if (spec.default !== undefined) {
        input.value = String(spec.default);
        values[name] = parseInt(spec.default, 10);
      }
      input.addEventListener('input', () => {
        values[name] = input.value ? parseInt(input.value, 10) : null;
        updateSubmit();
      });
      row.appendChild(input);
    } else {
      // Generic string input (e.g. 'mode' for regional_total).
      const input = document.createElement('input');
      input.type = 'text';
      if (spec.default !== undefined) {
        input.value = String(spec.default);
        values[name] = String(spec.default);
      }
      input.addEventListener('input', () => {
        values[name] = input.value || null;
        updateSubmit();
      });
      row.appendChild(input);
    }

    fieldsEl.appendChild(row);
  });

  function updateSubmit() {
    const ok = Object.entries(schema.params).every(([n, s]) => {
      if (!s.required) return true;
      return values[n] != null && values[n] !== '';
    });
    submitBtn.disabled = !ok;
  }
  updateSubmit();

  overlay.classList.add('active');

  return new Promise(resolve => {
    function done(result) {
      overlay.classList.remove('active');
      submitBtn.onclick = null;
      cancelBtn.onclick = null;
      resolve(result);
    }
    submitBtn.onclick = () => done(values);
    cancelBtn.onclick = () => done(null);
  });
}

async function handleQQ(q) {
  const schema = (await loadParamSchema())[q.id];
  if (!schema) {
    addMessage('assistant', `Unknown query: ${q.id}`);
    return;
  }

  // Seed prefilled values from current selection state.
  const prefilled = {};
  if (selectedStation) {
    if ('station_id' in schema.params) prefilled.station_id = selectedStation.id;
    // For two-station queries (compare_stations), seed the *first* slot.
    if ('station_id_1' in schema.params) prefilled.station_id_1 = selectedStation.id;
  }
  const yearVal = document.getElementById('year-select').value;
  if (yearVal) {
    if ('year' in schema.params) prefilled.year = parseInt(yearVal, 10);
    // For two-year queries (year_comparison), seed the *first* slot.
    if ('year_a' in schema.params) prefilled.year_a = parseInt(yearVal, 10);
  }

  // Determine which required params remain unmet.
  const missingRequired = Object.entries(schema.params).some(([name, spec]) => {
    if (!spec.required) return false;
    return !(name in prefilled);
  });

  let params;
  if (missingRequired || q.special) {
    params = await openParamPicker(q.id, prefilled);
    if (params == null) return;
  } else {
    params = prefilled;
  }

  const summary = Object.entries(params).map(([k, v]) => `${k}=${v}`).join(', ');
  addMessage('user', `${q.label}${summary ? ` (${summary})` : ''}`);
  sendQuery(q.id, params);
}

buildQQButtons();

// --- Chat messaging ---
function addMessage(role, content) {
  const messages = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = content;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

function renderResult(result) {
  const messages = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg assistant';

  let html = `<div class="msg-title">${result.title || ''}</div>`;

  if (result.type === 'table') {
    html += '<table><thead><tr>';
    result.columns.forEach(c => html += `<th>${c}</th>`);
    html += '</tr></thead><tbody>';
    result.rows.forEach(row => {
      html += '<tr>';
      row.forEach(cell => html += `<td>${cell}</td>`);
      html += '</tr>';
    });
    html += '</tbody></table>';
  }

  if (result.type === 'chart') {
    const chartId = 'chat-chart-' + (++chartIdCounter);
    html += `<div class="inline-chart" id="${chartId}"></div>`;
  }

  if (result.text) {
    html += `<div class="msg-text">${result.text}</div>`;
  }

  if (result._query_id) {
    const p = result._params || {};
    const paramStr = Object.entries(p).map(([k, v]) => `${k}=${v}`).join(', ');
    html += `<div class="msg-ran">Ran <code>${result._query_id}</code>${paramStr ? ` (${paramStr})` : ''}</div>`;
  }

  div.innerHTML = html;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;

  // Render Plotly chart if needed
  if (result.type === 'chart') {
    const chartEl = div.querySelector('.inline-chart');
    if (result.chart_type === 'grouped_bar') {
      const traces = result.data.series.map(s => ({
        x: result.data.labels, y: s.values,
        type: 'bar', name: s.name
      }));
      Plotly.newPlot(chartEl, traces, {
        barmode: 'group', margin: { t: 10, b: 30, l: 40, r: 10 },
        legend: { orientation: 'h', y: -0.2 }
      }, { responsive: true, displayModeBar: false });
    } else if (result.chart_type === 'line') {
      const traces = result.data.series.map(s => ({
        x: result.data.labels, y: s.values,
        type: 'scatter', mode: 'lines+markers', name: s.name
      }));
      Plotly.newPlot(chartEl, traces, {
        margin: { t: 10, b: 30, l: 40, r: 10 },
        legend: { orientation: 'h', y: -0.2 }
      }, { responsive: true, displayModeBar: false });
    } else {
      Plotly.newPlot(chartEl, [{
        x: result.data.labels, y: result.data.values,
        type: 'bar', marker: { color: '#42a5f5' }
      }], {
        margin: { t: 10, b: 30, l: 40, r: 10 }
      }, { responsive: true, displayModeBar: false });
    }
  }
}

function sendQuery(queryId, params) {
  const loadingDiv = addMessage('assistant', 'Analyzing...');
  loadingDiv.classList.add('loading-msg');

  fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ query_id: queryId, params })
  })
    .then(r => r.json())
    .then(data => {
      loadingDiv.remove();
      if (data.result) {
        renderResult(data.result);
      } else {
        addMessage('assistant', data.content || 'No results found.');
      }
    })
    .catch(() => {
      loadingDiv.remove();
      addMessage('assistant', 'Something went wrong. Please try again.');
    });
}

// --- Free-form input ---
function sendFreeform() {
  const input = document.getElementById('chat-input');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  addMessage('user', msg);

  const loadingDiv = addMessage('assistant', 'Thinking...');
  loadingDiv.classList.add('loading-msg');

  const context = {};
  if (selectedStation) context.selected_station = selectedStation.id;

  fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: msg, context })
  })
    .then(r => r.json())
    .then(data => {
      loadingDiv.remove();
      if (data.result) {
        renderResult(data.result);
        // The LLM second-pass answer (if any) follows the result card.
        if (data.content) addMessage('assistant', data.content);
      } else {
        addMessage('assistant', data.content || 'I could not process that query.');
      }
    })
    .catch(() => {
      loadingDiv.remove();
      addMessage('assistant', 'Something went wrong. Please try again.');
    });
}

document.getElementById('chat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendFreeform(); }
});

// --- LLM health check ---
fetch('/api/chat/health').then(r => r.json()).then(data => {
  llmAvailable = data.llm_available;
  if (llmAvailable) {
    document.getElementById('chat-input').disabled = false;
    document.getElementById('chat-send').disabled = false;
  } else {
    document.getElementById('llm-notice').style.display = 'block';
  }
}).catch(() => {
  document.getElementById('llm-notice').style.display = 'block';
});
